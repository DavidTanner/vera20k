name: Sim field ratchet

# Fails a change that raises the number of src/sim struct fields any simulation
# module can write (`pub`, `pub(crate)` and equivalents), so new simulation state
# stays private to its owning module (AGENTS.md and CLAUDE.md, "one authoritative
# owner"). It compares the checked-out commit with its first parent: for a pull
# request that is the merge with the base branch, for main the previous main.
# Takes seconds.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/sim_field_ratchet.py --base HEAD^1
