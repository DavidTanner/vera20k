name: Clippy

# Lints the library, binaries, integration tests and examples on the three main
# platforms (clippy also checks that they compile, so there is no separate
# `cargo check`, and no integration test or example can stop compiling
# unnoticed). The library's unit tests compile in the local full
# `cargo test --lib` run each change gets before it merges.
# Tests run in the per-platform workflows (windows.yml, linux.yml, ...), which
# are manual only. This lint takes about two minutes, so it runs on every pull
# request and every push to main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Pull requests: one group per branch, superseded runs are cancelled.
  # main: one group per commit, so no run is ever cancelled or replaced
  # (GitHub keeps only one pending run per group).
  group: clippy-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld

jobs:
  lint:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      # Reports warnings without failing.
      - name: Clippy (library, binaries, integration tests and examples)
        run: cargo clippy -p vera20k --lib --bins --test '*' --examples
